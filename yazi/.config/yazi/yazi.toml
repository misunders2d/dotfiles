[opener]
wps = [
	{ run = 'et "$@"', desc = "WPS Spreadsheets", orphan = true, for = "unix" },
]

[open]
prepend_rules = [
	{ url = "*.txt", use = "edit" },
	{ url = "*.csv", use = "wps" },
	{ url = "*.CSV", use = "wps" },
	{ mime = "text/csv", use = "wps" },
]

[plugin]
prepend_previewers = [
	{ url = "*.txt", run = "code" },
]
